[package]
name = "mpd-notify"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
bytes = "1.11.0"
dirs = "6.0.0"
hex = "0.4.3"
image = "0.25.9"
mpd_client = "1.4.1"
notify-rust = { version = "4.11.7", features = ["images"] }
regex-lite = "0.1.8"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
