name: Continuous Deployment

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check tag version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "mpd-herald") | .version'
          )"
          tag_version="${TAG_NAME#v}"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::tag version $tag_version does not match package version $package_version"
            exit 1
          fi

  release:
    name: Release
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare assets
        shell: bash
        run: |
          mkdir mpd-herald-${{ env.RELEASE_VERSION }}
          cp LICENSE README.md mpd-herald.service \
            target/${{ matrix.target }}/release/mpd-herald \
            mpd-herald-${{ env.RELEASE_VERSION }}

      - name: Package assets
        run: |
          tar czvf mpd-herald-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz \
            mpd-herald-${{ env.RELEASE_VERSION }}

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          files: mpd-herald-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz

  publish-cargo:
    name: Publish on crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
